# Partage d'écran de Packarch (cahier des charges § 9.3, décision 30), lu
# par xdg-desktop-portal-wlr quand XDG_CURRENT_DESKTOP commence par
# « packarch ». À installer dans /etc/xdg/xdg-desktop-portal-wlr/packarch ;
# ~/.config/xdg-desktop-portal-wlr/packarch le remplace.
#
# packarch-partage propose les écrans et les fenêtres dans rofi : partage
# d'un écran entier ou d'une seule fenêtre.
[screencast]
chooser_type=simple
chooser_cmd=packarch-partage
