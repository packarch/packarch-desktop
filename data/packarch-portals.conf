# Portails de Packarch (cahier des charges § 9.3), lus par xdg-desktop-portal
# quand XDG_CURRENT_DESKTOP commence par « packarch ». À installer dans
# /usr/share/xdg-desktop-portal/packarch-portals.conf
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Inhibit=none
