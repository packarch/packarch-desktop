[package]
name = "packarch-desktop"
version = "1.4.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Compositeur Wayland à fenêtres flottantes de Packarch"
publish = false

[[bin]]
name = "packarch"
path = "src/main.rs"

# Sélecteur du partage d'écran (xdg-desktop-portal-wlr)
[[bin]]
name = "packarch-partage"
path = "src/bin/packarch-partage.rs"

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "backend_egl",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "xwayland",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
roxmltree = "0.21"
cosmic-text = "0.14"
png = "0.17"
anyhow = "1"
libc = "0.2"
calloop = { version = "0.14", features = ["signals"] }
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
wayland-protocols = { version = "0.32.13", features = ["server", "client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["server"] }
wayland-server = "0.31"
wayland-client = "0.31"
xcursor = "0.3"

# Clients de test des scénarios (tests/capture.sh) : fenêtre d'une couleur
# unie, pointeur virtuel
[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[[example]]
name = "client-essai"

[[example]]
name = "pointeur-essai"

[[example]]
name = "fenetres-essai"

[[example]]
name = "dmabuf-essai"

[profile.release]
debug = "line-tables-only"

# Smithay 0.7.0 avec le point chaud du plan curseur des pilotes virtuels
# (virtio-gpu, qxl, vmwgfx : curseur double sous QEMU/SPICE), voir
# vendor/README.md ; à retirer quand Smithay le gérera
[patch.crates-io]
smithay = { path = "vendor/smithay" }
