[package]
name = "packarch-rwdesktop"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Compositeur Wayland à fenêtres flottantes de Packarch"
publish = false

[[bin]]
name = "packarch"
path = "src/main.rs"

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "backend_egl",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
roxmltree = "0.21"
cosmic-text = "0.14"
png = "0.17"
anyhow = "1"
libc = "0.2"
calloop = { version = "0.14", features = ["signals"] }
resvg = { version = "0.49", default-features = false }
wayland-protocols = { version = "0.32.13", features = ["server", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["server"] }
wayland-server = "0.31"
xcursor = "0.3"

[profile.release]
debug = "line-tables-only"
